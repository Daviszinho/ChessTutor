name: 🚀 Chess Puzzle Solver - Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'ChessPuzzleSolver/**'

env:
  PROJECT_ID: idyllic-parser-460423-r0
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: projects/674748941743/locations/global/workloadIdentityPools/github-pool/providers/github-actions-provider
        service_account: github-actions@idyllic-parser-460423-r0.iam.gserviceaccount.com
        project_id: idyllic-parser-460423-r0
        create_credentials_file: true
        token_format: access_token
        audience: https://token.actions.githubusercontent.com  # Añade esta línea

    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: idyllic-parser-460423-r0
        export_default_credentials: true

    - name: Build and push Docker image
      run: |-
        docker build -t gcr.io/$PROJECT_ID/chess-puzzle-solver:$GITHUB_SHA ./ChessPuzzleSolver
        docker push gcr.io/$PROJECT_ID/chess-puzzle-solver:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |-
        gcloud run deploy chess-puzzle-solver \
          --image gcr.io/$PROJECT_ID/chess-puzzle-solver:$GITHUB_SHA \
          --platform managed \
          --region us-central1 \
          --cpu 1 \
          --memory 512Mi \
          --port 3000 \
          --allow-unauthenticated \
          --timeout 30s