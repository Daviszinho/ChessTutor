name: 🚀 Chess Puzzle Solver - Build & Deploy to GCP

# Configuración de los eventos que activan el workflow
on:
  push:
    branches:
      - main  # Solo se activa en cambios a la rama main
    paths:
      - 'ChessPuzzleSolver/**'  # Solo se activa si hay cambios en la carpeta ChessPuzzleSolver

# Variables de entorno para el workflow
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      # Configura las credenciales de Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      # Configura el SDK de Google Cloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      # Construye la imagen de Docker
      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ env.PROJECT_ID }}/chess-puzzle-solver:${{ env.COMMIT_SHA }} \
            -t gcr.io/${{ env.PROJECT_ID }}/chess-puzzle-solver:latest \
            ./ChessPuzzleSolver
            
      # Autentica en Google Container Registry
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet
        
      # Sube la imagen a GCR
      - name: Push Docker image
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/chess-puzzle-solver:${{ env.COMMIT_SHA }}
          docker push gcr.io/${{ env.PROJECT_ID }}/chess-puzzle-solver:latest
          
      # Despliega en Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy chess-puzzle-solver \
            --image gcr.io/${{ env.PROJECT_ID }}/chess-puzzle-solver:${{ env.COMMIT_SHA }} \
            --platform managed \
            --region us-central1 \
            --cpu 1 \
            --memory 512Mi \
            --port 3000 \
            --allow-unauthenticated \
            --timeout 30s \
            --quiet
