name: Build and Deploy Container to Azure

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Tutorial/**'
  workflow_dispatch:

env:
  CONTAINER_NAME: "chess-tutor"
  RESOURCE_GROUP: "LinuxDockerResourceGroup"  # Replace with your resource group name
  WEBAPP_NAME: "ChessTutorDockerApp"  # Web app name in Azure

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build container image
      uses: docker/build-push-action@v4
      with:
        context: ./Tutorial
        push: false
        tags: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
        file: ./Tutorial/Dockerfile

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        images: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
