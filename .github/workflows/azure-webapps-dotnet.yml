name: Build and deploy ASP.Net Core app to Azure Web App - ChessTutor

on:
  push:
    branches:
      - main
    paths:
      - 'Tutorial/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ChessTutor                     # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: './publish'            # set this to the path to your web app project
  DOTNET_VERSION: '9.0.x'                           # set this to the .NET version to use
  RESOURCE_GROUP_NAME: ChessTutorResourceGroup      # set this to your resource group name
  SERVICE_PLAN_NAME: ChessTutorPlan                 # set this to your app service plan name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build with dotnet
        run: dotnet build ChessTutor.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish ChessTutor.sln -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
